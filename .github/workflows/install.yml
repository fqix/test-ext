name: Install

# Installs fqix.apple-container-tools from the VS Code Marketplace into a clean, freshly
# downloaded VS Code on several macOS runner images and checks what landed on disk.
on:
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is busiest (UTC).
    - cron: '17 * * * *'
  # Still runs when this workflow itself changes, so edits are checked right away.
  push:
    branches: [main]
    paths: [.github/workflows/install.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Extension version to install (empty = latest on the Marketplace)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTENSION_ID: fqix.apple-container-tools
  EXTENSION_VERSION: ${{ inputs.version }}

jobs:
  install:
    name: ${{ matrix.os }} / VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon images. The extension is published for darwin-arm64 only, so these
        # must install it; macos-latest is macos-26 today.
        os: [macos-15, macos-26]
        # 1.90.0 is the extension's minimum engines.vscode version.
        vscode: ['1.90.0', 'stable']
        platform: [darwin-arm64]
        expect: [installed]
        include:
          # Intel images: no darwin-x64 build exists, so the Marketplace must refuse it.
          - os: macos-15-intel
            vscode: stable
            platform: darwin
            expect: unavailable
          - os: macos-26-intel
            vscode: stable
            platform: darwin
            expect: unavailable
    steps:
      - name: Show runner image
        run: |
          sw_vers
          uname -m
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"

      - name: Download VS Code ${{ matrix.vscode }} (${{ matrix.platform }})
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
          VSCODE_PLATFORM: ${{ matrix.platform }}
        run: |
          version="$VSCODE_VERSION"
          [ "$version" = stable ] && version=latest
          dir="$RUNNER_TEMP/vscode"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/vscode.zip" \
            "https://update.code.visualstudio.com/$version/$VSCODE_PLATFORM/stable"
          # ditto keeps the app bundle's symlinks and attributes intact.
          ditto -xk "$dir/vscode.zip" "$dir"
          cli="$dir/Visual Studio Code.app/Contents/Resources/app/bin/code"
          test -x "$cli"
          echo "VSCODE_CLI=$cli" >> "$GITHUB_ENV"
          # Separate profile and extensions directories keep the runner's state out of the check.
          echo "VSCODE_USER_DIR=$RUNNER_TEMP/vscode-user" >> "$GITHUB_ENV"
          echo "VSCODE_EXT_DIR=$RUNNER_TEMP/vscode-extensions" >> "$GITHUB_ENV"
          "$cli" --version

      - name: Install from the Marketplace
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          target="$EXTENSION_ID"
          [ -n "$EXTENSION_VERSION" ] && target="$EXTENSION_ID@$EXTENSION_VERSION"
          echo "Installing $target (expect: $EXPECT)"
          status=0
          "$VSCODE_CLI" --user-data-dir "$VSCODE_USER_DIR" --extensions-dir "$VSCODE_EXT_DIR" \
            --install-extension "$target" --force || status=$?
          if [ "$EXPECT" = installed ] && [ "$status" -ne 0 ]; then
            echo "::error::installing $target failed with exit code $status"
            exit 1
          fi
          if [ "$EXPECT" = unavailable ] && [ "$status" -eq 0 ]; then
            echo "::error::$target installed on $(uname -m), but only darwin-arm64 is published"
            exit 1
          fi
          echo "Install exit code $status, as expected"

      - name: Verify installation
        env:
          EXPECT: ${{ matrix.expect }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          installed="$("$VSCODE_CLI" --user-data-dir "$VSCODE_USER_DIR" --extensions-dir "$VSCODE_EXT_DIR" \
            --list-extensions --show-versions)"
          echo "$installed"
          line="$(echo "$installed" | grep -i "^$EXTENSION_ID@" || true)"
          if [ "$EXPECT" = unavailable ]; then
            if [ -n "$line" ]; then
              echo "::error::$line is installed on an Intel runner"
              exit 1
            fi
            echo "### $RUNNER_LABEL: not installable, as expected" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$line" ]; then
            echo "::error::$EXTENSION_ID is not installed"
            exit 1
          fi
          if [ -n "$EXTENSION_VERSION" ] && [ "$line" != "$EXTENSION_ID@$EXTENSION_VERSION" ]; then
            echo "::error::installed $line, expected $EXTENSION_ID@$EXTENSION_VERSION"
            exit 1
          fi
          # The Marketplace must have served the darwin-arm64 build with its runtime files.
          ext="$(ls -d "$VSCODE_EXT_DIR"/"$EXTENSION_ID"-*-darwin-arm64 2>/dev/null | head -n 1)"
          if [ -z "$ext" ]; then
            echo "::error::no darwin-arm64 build of $EXTENSION_ID in $VSCODE_EXT_DIR"
            ls -la "$VSCODE_EXT_DIR"
            exit 1
          fi
          test -f "$ext/dist/extension.js"
          test -f "$ext/dist/docker-shim.js"
          test -d "$ext/dist/devcontainer-cli"
          test -f "$ext/dist/webview/webview.js"
          echo "### $RUNNER_LABEL: installed $line" >> "$GITHUB_STEP_SUMMARY"
          echo "Installed $line at $ext"
